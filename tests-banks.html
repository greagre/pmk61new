<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pmk61 — банки, страницы, ввод F0</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; background: #f4f2ea; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { margin: 0 0 12px; color: #666; font-size: 13px; }
  .sum { font-weight: 700; padding: 10px 12px; border-radius: 10px; background: #fff; margin-bottom: 12px; }
  .sum.ok { color: #157a3f; }
  .sum.bad { color: #a01f1f; }
  ol { margin: 0; padding: 0; list-style: none; }
  li { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  li .tag { display: inline-block; min-width: 64px; font-weight: 700; margin-right: 8px; }
  li.pass .tag { color: #157a3f; }
  li.fail .tag { color: #a01f1f; }
  li .why { display: block; margin-top: 4px; color: #a01f1f; font-size: 13px; }
  .back { display: inline-block; margin-top: 14px; color: #157a3f; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181a; color: #e8e8e8; }
    .sum, li { background: #22262a; }
    li .why { color: #ff8f8f; }
  }
</style>
</head>
<body>
<h1>Банки, страницы, ввод F0</h1>
<p class="sub">Проверка на настоящем ядре: переключение банков, межбанковый доступ, страницы программы и ввод двухбайтной команды с клавиатуры.</p>
<div class="sum" id="sum">Идёт проверка…</div>
<ol id="list"></ol>
<a class="back" href="index.html?v=61&amp;model=mk-61-ext">← к эмулятору, модель «МК-61 (расширенный)»</a>

<!-- Модель, которую видит ext61-boot.js при создании ядра.
     В тестах она всегда расширенная, кроме одной специальной проверки. -->
<select id="model" hidden>
  <option value="mk-61">МК-61</option>
  <option value="mk-61-ext" selected>МК-61 (расширенный)</option>
</select>

<script src="core.js?v=13"></script>
<script src="ext61.js?v=9"></script>
<script src="ext61-boot.js?v=9"></script>
<script>
(function () {
  'use strict';

  var listEl = document.getElementById('list');
  var sumEl = document.getElementById('sum');
  var passed = 0, failed = 0;

  function row(ok, name, why) {
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = ok ? 'OK' : 'ОШИБКА';
    var nameEl = document.createElement('span');
    nameEl.textContent = name;
    li.appendChild(tag);
    li.appendChild(nameEl);
    if (!ok && why) {
      var w = document.createElement('span');
      w.className = 'why';
      w.textContent = why;
      li.appendChild(w);
    }
    listEl.appendChild(li);
  }

  function eq(got, want) {
    return got === want ? true : 'получено ' + JSON.stringify(got) + ', ожидалось ' + JSON.stringify(want);
  }

  function check(name, fn) {
    var res;
    try {
      res = fn();
    } catch (e) {
      res = 'исключение: ' + ((e && e.message) ? e.message : e);
    }
    if (res === true) { passed++; row(true, name); }
    else { failed++; row(false, name, String(res)); }
  }

  /* ---------- вспомогательное ---------- */

  function makeCore() {
    return window.MKCore.create({ onEvent: function () {} });
  }

  /* ВАЖНО: core.setProgram() не только кладёт программу, но и создаёт
     НОВЫЙ массив ST.R — регистры при этом обнуляются (если не передан
     keepRegisters). Поэтому в тестах банков программа пишется напрямую
     в ST.prog, иначе значения регистров стираются ещё до проверки. */
  function progSet(core, arr) {
    for (var i = 0; i < core.PROG_LEN; i++) core.ST.prog[i] = core.NOP;
    for (var j = 0; j < arr.length; j++) core.ST.prog[j] = arr[j] & 0xFF;
    core.ST.ip = 0;
    core.ST.err = false;
  }

  function setProg(core, arr) {
    var a = new Array(core.PROG_LEN).fill(core.NOP);
    for (var i = 0; i < arr.length; i++) a[i] = arr[i] & 0xFF;
    core.setProgram(a);
    core.ST.ip = 0;
    return a;
  }

  function forcePrg(core) {
    if (core.ST && typeof core.ST.prg === 'boolean') core.ST.prg = true;
    else if (core.ST) core.ST.mode = 'ПРГ';
    core.ST.layer = 'f';
    core.ST.ip = 0;
  }

  /* ---------- 1. расширение подключено, ядро осталось ядром ---------- */

  check('ядро создано, расширение лежит рядом (не вместо)', function () {
    var c = makeCore();
    if (typeof c.fmt !== 'function') return 'нет core.fmt — наружу ушла обёртка';
    if (typeof c.key !== 'function') return 'нет core.key';
    if (!c.ext) return 'нет core.ext — расширение не включилось';
    return eq(typeof c.writeExt, 'function');
  });

  check('без модели «расширенный» ядро обычное', function () {
    var sel = document.getElementById('model');
    var old = sel.value;
    sel.value = 'mk-61';
    var c = window.MKCore.create({ onEvent: function () {} });
    sel.value = old;
    if (c.ext) return 'расширение включилось для обычной модели';
    return eq(typeof c.writeExt, 'undefined');
  });

  check('writeExt пишет два байта и сдвигает адрес на 2', function () {
    var c = makeCore();
    c.ST.ip = 0;
    var wrote = c.writeExt(0x04);
    if (wrote !== true) return 'writeExt вернул ' + wrote;
    if (c.ST.prog[0] !== 0xF0) return 'нет префикса F0 в ячейке 00';
    if (c.ST.prog[1] !== 0x04) return 'нет второго байта 04 в ячейке 01';
    return eq(c.ST.ip, 2);
  });

  /* ---------- 2. банки ---------- */

  check('F0 01 выбирает банк 1', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x01, 0x50]);
    c.step();
    return eq(c.ext.bank(), 1);
  });

  check('F0 04 отдаёт номер банка в X', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x02]);
    c.step();
    progSet(c, [0xF0, 0x04, 0x50]);
    c.step();
    return eq(c.ST.X, 2);
  });

  check('банк 0 не меняется от записи в банк 1', function () {
    var c = makeCore();
    c.ext.selectBank(1);
    c.ST.R[1] = 222;
    c.ext.selectBank(0);
    c.ST.R[1] = 111;
    c.ext.selectBank(1);
    if (c.ST.R[1] !== 222) return 'в банке 1 ожидалось 222, получено ' + c.ST.R[1];
    c.ext.selectBank(0);
    return eq(c.ST.R[1], 111);
  });

  check('банк 1 не видит регистры банка 0', function () {
    var c = makeCore();
    c.ST.R[3] = 77;
    c.ext.selectBank(1);
    return eq(c.ST.R[3], 0);
  });

  check('setProgram не отвязывает текущий банк', function () {
    var c = makeCore();
    c.ext.selectBank(2);
    c.setProgram([]);
    c.ST.R[0] = 33;
    if (c.ext.bank() !== 2) return 'банк сбился: ' + c.ext.bank();
    c.ext.selectBank(0);
    c.ext.selectBank(2);
    return eq(c.ST.R[0], 33);
  });

  /* ---------- 3. банк-адресат ---------- */

  check('F0 05 берёт банк-адресат из X', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x05, 0x50]);
    c.ST.X = 2;
    c.step();
    return eq(c.ext.targetBank(), 2);
  });

  check('F0 06 кладёт банк-адресат в X', function () {
    var c = makeCore();
    c.ext.setTargetBank(3);
    progSet(c, [0xF0, 0x06, 0x50]);
    c.step();
    return eq(c.ST.X, 3);
  });

  check('F0 05 не принимает номер банка 9', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x05, 0x50]);
    c.ST.X = 9;
    var res = c.step();
    if (res !== 'error') return 'команда не дала ЕГГОГ, результат ' + res;
    return eq(c.ST.err, true);
  });

  check('F0 40 пишет в банк-адресат, текущий банк не меняя', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x40, 0x50]);
    c.ext.setTargetBank(1);
    c.ST.X = 7;
    c.step();
    if (c.ext.bank() !== 0) return 'текущий банк стал ' + c.ext.bank();
    c.ext.selectBank(1);
    return eq(c.ST.R[0], 7);
  });

  check('F0 60 читает из банка-адресата', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x62, 0x50]);
    c.ext.setTargetBank(0);
    c.ST.R[2] = 42;
    c.step();
    return eq(c.ST.X, 42);
  });

  check('F0 4F пишет в R0 — младшая цифра F значит R0', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x4F, 0x50]);
    c.ext.setTargetBank(0);
    c.ST.X = 9;
    c.step();
    return eq(c.ST.R[0], 9);
  });

  /* ---------- 4. сброс ---------- */

  check('сброс гасит соседние банки и оставляет текущий', function () {
    var c = makeCore();
    c.ext.selectBank(1);
    c.ST.R[0] = 55;
    c.ext.selectBank(0);
    c.reset(false);
    if (c.ext.bank() !== 0) return 'банк после сброса ' + c.ext.bank();
    if (c.ext.targetBank() !== 0) return 'банк-адресат не сброшен: ' + c.ext.targetBank();
    c.ext.selectBank(1);
    return eq(c.ST.R[0], 0);
  });

  check('сброс не стирает программу', function () {
    var c = makeCore();
    progSet(c, [0x51, 0x52]);
    c.reset(false);
    return eq(c.ST.prog[0], 0x51);
  });

  /* ---------- 5. страницы ---------- */

  check('F0 21 уводит на страницу 1 и ставит адрес 00', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x21]);
    c.step();
    if (c.ext.page() !== 1) return 'страница ' + c.ext.page();
    return eq(c.ST.ip, 0);
  });

  check('повторный F0 21 на той же странице не зацикливает', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x21]);
    c.step();
    progSet(c, [0xF0, 0x21]);
    c.step();
    return eq(c.ST.ip, 2);
  });

  check('F0 24 отдаёт номер страницы в X', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x22]);
    c.step();
    progSet(c, [0xF0, 0x24]);
    c.step();
    return eq(c.ST.X, 2);
  });

  check('страницы хранят программы раздельно', function () {
    var c = makeCore();
    progSet(c, [0xF0, 0x21]);        /* страница 0: переход на страницу 1 */
    c.step();
    if (c.ext.page() !== 1) return 'не ушли на страницу 1: ' + c.ext.page();

    progSet(c, [0x53, 0xF0, 0x20]);  /* страница 1: 53 и возврат на страницу 0 */
    c.ST.ip = 1;
    c.step();
    if (c.ext.page() !== 0) return 'не вернулись на страницу 0: ' + c.ext.page();
    if (c.ST.prog[0] !== 0xF0 || c.ST.prog[1] !== 0x21) {
      return 'программа страницы 0 испорчена: ' + c.ST.prog[0] + ', ' + c.ST.prog[1];
    }

    c.ST.ip = 0;
    c.step();                         /* снова на страницу 1 */
    return eq(c.ST.prog[0], 0x53);
  });

  /* ---------- 6. ввод F0 с клавиатуры ---------- */

  check('клавиатура: F0 + 4 + 0 записывает F0 40', function () {
    var c = makeCore();
    forcePrg(c);
    c.key({ a: 'ext0' });
    c.key({ a: 'digit', d: '4' });
    c.key({ a: 'digit', d: '0' });
    if (c.ST.prog[0] !== 0xF0) return 'первая ячейка 0x' + c.ST.prog[0].toString(16);
    return eq(c.ST.prog[1], 0x40);
  });

  check('клавиатура: после F0 панель возвращается к цифрам', function () {
    var c = makeCore();
    forcePrg(c);
    c.ST.layer = 'f';
    c.key({ a: 'ext0' });
    return eq(c.ST.layer, 'main');
  });

  check('клавиатура: после записи команды слой остаётся цифровым', function () {
    var c = makeCore();
    forcePrg(c);
    c.key({ a: 'ext0' });
    c.key({ a: 'digit', d: '0' });
    c.key({ a: 'digit', d: '1' });
    return eq(c.ST.layer, 'main');
  });

  check('клавиатура: недопустимый байт не записывается', function () {
    var c = makeCore();
    forcePrg(c);
    c.key({ a: 'ext0' });
    c.key({ a: 'digit', d: '0' });
    c.key({ a: 'digit', d: '7' });
    if (c.ST.prog[0] === 0xF0) return 'записалась команда F0 07, которой нет';
    return true;
  });

  check('клавиатура: посторонняя клавиша отменяет ожидание', function () {
    var c = makeCore();
    forcePrg(c);
    c.key({ a: 'ext0' });
    c.key({ a: 'layer', c: 'k' });
    c.key({ a: 'digit', d: '4' });
    c.key({ a: 'digit', d: '0' });
    if (c.ST.prog[0] === 0xF0) return 'ожидание не отменилось, записалось F0';
    return true;
  });

  /* ---------- 7. имена команд ---------- */

  check('имена EXT-команд на месте', function () {
    var E = window.MKExt61;
    if (!E) return 'MKExt61 не загружен';
    if (!E.isExt(0x40)) return '0x40 не считается командой расширения';
    if (E.isExt(0x07)) return '0x07 ошибочно считается командой';
    if (String(E.extName(0x40)).indexOf('R0') < 0) return 'имя 0x40: ' + E.extName(0x40);
    if (String(E.extName(0x63)).indexOf('R3') < 0) return 'имя 0x63: ' + E.extName(0x63);
    if (String(E.extName(0x24)).indexOf('страница') < 0) return 'имя 0x24: ' + E.extName(0x24);
    return true;
  });

  /* ---------- итог ---------- */

  var total = passed + failed;
  sumEl.textContent = 'Пройдено ' + passed + ' из ' + total + (failed ? ' — ошибок: ' + failed : ' — всё зелёное');
  sumEl.className = 'sum ' + (failed ? 'bad' : 'ok');
})();
</script>
</body>
</html>
